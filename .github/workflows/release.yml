name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAGES: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install -g npm@10.9.0
      - run: npm ci
      - run: npm run validate:data
      - run: npm run audit:claims
      - run: npm run check:links
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      - run: npm run verify:out
      - run: npm run verify:github-pages
      - run: npx playwright install --with-deps chromium
      - uses: browser-actions/setup-chrome@v1
        id: setup-chrome
      - run: npm run test:e2e
      - run: npm run lighthouse
        env:
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
      - run: npm audit --audit-level=high
      - run: npm run report
      - run: cd out && zip -r ../portfolio-static.zip .
      - run: |
          cat > RELEASE_NOTES.md <<'NOTES'
          # v1.0.1

          Patch release for GitHub Pages project-site hosting.

          This release fixes static asset URLs for the `/dotnet-portfolio-website/` base path, adds `.nojekyll`, and validates the exported site with a local GitHub Pages simulation.
          NOTES
      - run: sha256sum portfolio-static.zip portfolio-report.json lighthouse-report.html lighthouse-report.json RELEASE_NOTES.md > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.1
          files: |
            portfolio-static.zip
            portfolio-report.json
            lighthouse-report.html
            lighthouse-report.json
            RELEASE_NOTES.md
            SHA256SUMS
